[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-edge-agent"
version = "0.1.0"
description = "Secure read-only local database executor and tunnel agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "cryptography>=42.0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]
